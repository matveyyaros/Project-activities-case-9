defaults:
  - /grid_param: grid_SGDRegressor_Robust

name: SGDRegressor_Robust

preprocessing:

  - _target_: sklearn.preprocessing.RobustScaler

  - _target_: sklearn.preprocessing.PolynomialFeatures
    include_bias: false

  - _target_: sklearn.preprocessing.RobustScaler

model:
  _target_: sklearn.linear_model.SGDRegressor
  eta0: 0.0001
  learning_rate: adaptive
  max_iter: 200000
  random_state: ${seed}
  loss: huber
