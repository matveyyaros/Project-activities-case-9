defaults:
  - /grid_param: grid_SGDRegressor_Quantile

name: SGDRegressor_Quantile

preprocessing:

  - _target_: sklearn.preprocessing.QuantileTransformer
    random_state: ${seed}

  - _target_: sklearn.preprocessing.PolynomialFeatures
    include_bias: false

  - _target_: sklearn.preprocessing.QuantileTransformer
    random_state: ${seed}

model:
  _target_: sklearn.linear_model.SGDRegressor
  eta0: 0.0001
  learning_rate: adaptive
  max_iter: 200000
  random_state: ${seed}
  loss: huber
