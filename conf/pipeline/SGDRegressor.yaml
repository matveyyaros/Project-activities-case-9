preprocessing:

  - _target_: sklearn.preprocessing.StandardScaler

  - _target_: sklearn.preprocessing.PolynomialFeatures
    include_bias: false

  - _target_: sklearn.preprocessing.StandardScaler
model:
  _target_: sklearn.linear_model.SGDRegressor
  eta0: 0.0001
  learning_rate: adaptive
  max_iter: 200000
  random_state: ${seed}
  loss: huber