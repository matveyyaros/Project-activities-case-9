seed: 42
output_path: "\\model.joblib"



hydra:
  run:
    # Теперь путь будет: outputs/название_задачи/2026-11-13_14-30-00/
    dir: reports/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    # Для мультизапусков: multirun/дата/время/номер_задачи
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

data:
  test_size: 0.2
  numerical_features:
    - MaxOfLowerTRange
    - RainingDays

# Препроцессинг можно отключить, установив null
preprocessing:
  - _target_: sklearn.preprocessing.StandardScaler
  - _target_: sklearn.compose.ColumnTransformer
    transformers:
      - - num
        - _target_: sklearn.pipeline.Pipeline
          steps:
            - - imputer
              - _target_: sklearn.impute.SimpleImputer
                strategy: median
            - - scaler
              - _target_: sklearn.preprocessing.StandardScaler
        - ${data.numerical_features}
    remainder: passthrough
    verbose_feature_names_out: false

  - _target_: sklearn.decomposition.PCA
    n_components: 2
    random_state: ${seed}

model:
  _target_: sklearn.linear_model.LinearRegression

cv:
  enabled: true
  folds: 5