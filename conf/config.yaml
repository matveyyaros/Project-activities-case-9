
defaults:
  - pipeline@_global_: Ridge
  - grid_param: grid_Ridge
  - _self_

seed: 42
output_path: "\\model.joblib"



hydra:
  run:
    dir: reports/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

data:
  test_size: 0.2
  target_feature:
    yield
  numerical_features:
    - clonesize
    - honeybee
    - bumbles
    - andrena
    - osmia
    - AverageOfUpperTRange
    - RainingDays



cv:
  enabled: true
  folds: 10
  scoring: r2

