
defaults:
  - pipeline@_global_: default
  - grid_param: 
  - _self_

seed: 42
output_path: "\\model.joblib"



hydra:
  run:
    dir: reports/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

data:
  test_size: 0.2
  numerical_features:
    - MaxOfLowerTRange
    - RainingDays


cv:
  enabled: true
  folds: 5

