
defaults:
  - pipeline@_global_: default   # ← ключевой момент
  - _self_

seed: 42
output_path: "\\model.joblib"



hydra:
  run:
    # Теперь путь будет: outputs/название_задачи/2026-11-13_14-30-00/
    dir: reports/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    # Для мультизапусков: multirun/дата/время/номер_задачи
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

data:
  test_size: 0.2
  numerical_features:
    - MaxOfLowerTRange
    - RainingDays


cv:
  enabled: true
  folds: 5